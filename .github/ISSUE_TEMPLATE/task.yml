name: Task
description: A unit of project work tracked by task ID in STATUS.md.
title: "[ID] "
labels: ["task"]
body:
  - type: input
    id: task-id
    attributes:
      label: Task ID
      description: The ID from STATUS.md (for example D4).
      placeholder: "D4"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: The test or measurement that shows it is done.
    validations:
      required: true
