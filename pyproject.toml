[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-archaeologist"
version = "0.1.0"
description = "Detecting where legacy COBOL banking code has drifted from the financial regulation it was built to satisfy."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=49,<50",
    "tree_sitter==0.21.3",
    "pydantic>=2",
    "pdfplumber",
    "mcp>=1.27,<2",
]

[project.scripts]
cobol-archaeologist = "cobol_archaeologist.cli:main"
cobol-archaeologist-mcp = "cobol_archaeologist.mcp_server.server:main"

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "ruff==0.16.3",
    "setuptools>=68",
    "wheel",
]
# Retrieval model backend (T3.2). Pinned neural embedder + cross-encoder; small
# enough for air-gapped on-prem (T7.2). Offline gates do not need this; only the
# @network gates and the relevance-report build do.
models = [
    "sentence-transformers>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not network' --basetemp=.pytest_tmp"
testpaths = ["tests"]
markers = [
    "network: test loads pinned model weights / needs network; run locally (T3.2 Gate B/C)",
]

[tool.ruff.lint.per-file-ignores]
"scripts/build_verify_nli_cache.py" = ["E402"]
